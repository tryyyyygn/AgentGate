name: Refresh download count

on:
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: download-count
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh release asset count
        run: node scripts/update-download-count.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed count
        shell: bash
        run: |
          if git diff --quiet -- docs/download-count.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download-count.json
          git commit -m "chore: refresh download count"
          git push
